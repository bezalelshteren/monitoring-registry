apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-servicecdcz1-grafana-dashboard
  namespace: customer-test8-prd-orders-servicecdcz1
  labels:
    grafana_dashboard: "1"

data:
  orders-servicecdcz1-dashboard.json: |
    {
      "id": null,
      "uid": "orders-servicecdcz1-prd1",
      "title": "orders-servicecdcz1 - prd1",
      "tags": [
        "monitoring",
        "customer-test8",
        "orders-servicecdcz1",
        "prd1"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Total Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "count(kube_pod_info{namespace=\"customer-test8-prd-orders-servicecdcz1\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "Running Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"customer-test8-prd-orders-servicecdcz1\", phase=\"Running\"} == 1)",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          }
        },
