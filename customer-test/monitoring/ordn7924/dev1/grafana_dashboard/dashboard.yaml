apiVersion: v1
kind: ConfigMap
metadata:
  name: ordn7924-grafana-dashboard
  namespace: customer-test-dev-ordn7924
  labels:
    grafana_dashboard: "1"

data:
  ordn7924-dashboard.json: |
    {
      "id": null,
      "uid": "ordn7924-dev1",
      "title": "ordn7924 - dev1",
      "tags": [
        "monitoring",
        "customer-test",
        "ordn7924",
        "dev1"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Total Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "count(kube_pod_info{namespace=\"customer-test-dev-ordn7924\"})",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "Running Pods",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"customer-test-dev-ordn7924\", phase=\"Running\"} == 1)",
              "refId": "A"
            }
          ],
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 0
          }
        },
        {
          "id": 3,
          "title": "Faile